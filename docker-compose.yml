version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: findit
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/findit
      JWT_SECRET: dev-secret
      RUN_WORKER: "false"
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "npm run migrate && npm start"

  worker:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/findit
      JWT_SECRET: dev-secret
    depends_on:
      db: { condition: service_healthy }
    command: npm run worker

volumes:
  pgdata:
