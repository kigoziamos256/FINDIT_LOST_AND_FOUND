services:
  - type: web
    name: findit-lost-found
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: findit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_WORKER
        value: "true"
      - key: NODE_VERSION
        value: "18.20.4"

databases:
  - name: findit-db
    plan: free
    databaseName: findit
    user: findit
